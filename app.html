const BLOB_URL = 'https://jsonblob.com/api/jsonBlob/019e62c2-b4ef-7f83-8060-591ceeddefd0';
let _saveTimer = null;

function _bakLoad() {
  try { const b = JSON.parse(localStorage.getItem('mapap_bak') || '{}'); return b; } catch(e) { return {}; }
}
function _bakSave() {
  try { localStorage.setItem('mapap_bak', JSON.stringify({tasks: state.tasks, tracks: state.tracks, kpiEntries: state.kpiEntries})); } catch(e) {}
}

async function loadFromCloud() {
  try {
    const res = await fetch(BLOB_URL + '?_=' + Date.now());
    if (!res.ok) throw new Error();
    const data = await res.json();
    state.tasks      = data.tasks      || TASKS.map(t=>({...t}));
    state.tracks     = data.tracks     || TRACKS.map(t=>({...t}));
    state.kpiEntries = data.kpiEntries || [];
    _bakSave();
  } catch(e) {
    const bak = _bakLoad();
    if (bak.tasks)  state.tasks  = bak.tasks;
    if (bak.tracks) state.tracks = bak.tracks;
  }
}

function saveToCloud() {
  _bakSave(); // мгновенный локальный бэкап
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (dot) { dot.style.background = '#fbbf24'; }
    if (lbl) lbl.textContent = 'Сохранение...';
    try {
      await fetch(BLOB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ tasks: state.tasks, tracks: state.tracks, kpiEntries: state.kpiEntries })
      });
      if (dot) dot.style.background = '#22c55e';
      if (lbl) lbl.textContent = 'Синхронизировано';
    } catch(e) {
      if (dot) dot.style.background = '#f87171';
      if (lbl) lbl.textContent = 'Нет соединения';
    }
  }, 600);
}

// каждые 20 сек подтягиваем изменения от других пользователей
function startPolling() {
  setInterval(async () => {
    if (!state.user || state.modal || state.showCreateModal) return;
    try {
      const res = await fetch(BLOB_URL + '?_=' + Date.now());
      if (!res.ok) return;
      const data = await res.json();
      if (JSON.stringify(data.tasks)      !== JSON.stringify(state.tasks)  ||
          JSON.stringify(data.tracks)     !== JSON.stringify(state.tracks) ||
          JSON.stringify(data.kpiEntries) !== JSON.stringify(state.kpiEntries)) {
        state.tasks      = data.tasks;
        state.tracks     = data.tracks;
        state.kpiEntries = data.kpiEntries || [];
        _bakSave();
        render();
      }
    } catch(e) {}
  }, 20000);
}

function assigneeName(id) { return getUser(id)?.name || '—'; }

function summaryRows() {
  return USERS.map(u => {
    const ut = state.tasks.filter(t => t.assignee === u.id);
    return {
      id: u.id, name: u.name,
      total:    ut.length,
      high:     ut.filter(t => t.priority === 1).length,
      medium:   ut.filter(t => t.priority === 2).length,
      inprog:   ut.filter(t => t.status === 'in_progress').length,
      done:     ut.filter(t => t.status === 'done').length,
    };
  });
}

function filteredTasks() {
  return state.tasks.filter(t => {
    if (state.filterAssignee && t.assignee !== state.filterAssignee) return false;
    if (state.filterDir    && t.dir !== state.filterDir)    return false;
    if (state.filterStatus && t.status !== state.filterStatus) return false;
    if (state.filterPriority && t.priority !== state.filterPriority) return false;
    return true;
  });
}

const STATUS_CFG = {
  new:         { label:'Новая',           cls:'bg-gray-100 text-gray-700' },
  in_progress: { label:'В работе',        cls:'bg-blue-100 text-blue-700' },
  review:      { label:'На проверке',     cls:'bg-yellow-100 text-yellow-700' },
  done:        { label:'Готово',          cls:'bg-green-100 text-green-700' },
  blocked:     { label:'Заблокировано',   cls:'bg-red-100 text-red-700' },
};
const PRI_CFG = {
  1: { label:'🔴 Высокий', cls:'bg-red-100 text-red-700' },
  2: { label:'🟡 Средний', cls:'bg-yellow-100 text-yellow-700' },
  3: { label:'Низкий',     cls:'bg-gray-100 text-gray-600' },
};
function statusBadge(s) {
  const c = STATUS_CFG[s] || STATUS_CFG.new;
  return `<span class="badge ${c.cls}">${c.label}</span>`;
}
function priBadge(p) {
  const c = PRI_CFG[p] || PRI_CFG[2];
  return `<span class="badge ${c.cls}">${c.label}</span>`;
}
function dueLabel(d) {
  if (!d) return '<span class="text-gray-300 text-xs">—</span>';
  const diff = Math.ceil((new Date(d) - Date.now()) / 86400000);
  const label = new Date(d).toLocaleDateString('ru-RU');
  if (diff < 0) return `<span class="text-red-600 text-xs font-medium">${label} ⚠</span>`;
  if (diff <= 2) return `<span class="text-orange-500 text-xs font-medium">${label}</span>`;
  return `<span class="text-gray-500 text-xs">${label}</span>`;
}

    return { dir:d, total:dt.length, done:dt.filter(t=>t.status==='done').length, inprog:dt.filter(t=>t.status==='in_progress').length, overdue:dt.filter(t=>t.due&&new Date(t.due)<new Date()&&t.status!=='done').length };
  });
  const grandTotal = rows.reduce((a,r)=>a+r.total,0);
  const grandDone  = rows.reduce((a,r)=>a+r.done,0);

  return `
  <div class="p-6 space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Отчёты</h1>

          <th class="text-center pb-3">Прогресс</th>
        </tr></thead>

            const pct = r.total>0?Math.round(r.done/r.total*100):0;
            return `<tr class="border-b last:border-0">
              <td class="py-3 font-medium">${r.name}</td>
              <td class="text-center py-3 font-bold text-gray-800">${r.total}</td>
              <td class="text-center py-3 text-red-600">${r.high}</td>
              <td class="text-center py-3 text-yellow-600">${r.medium}</td>
              <td class="text-center py-3 text-blue-600">${r.inprog}</td>
              <td class="text-center py-3 text-green-600">${r.done}</td>
              <td class="py-3 px-4">
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:${pct}%"></div></div>
                  <span class="text-xs text-gray-500" style="width:32px">${pct}%</span>

              </td>

            <td class="py-3">Итого</td>
            <td class="text-center py-3">${grandTotal}</td>
            <td class="text-center py-3 text-red-600">${rows.reduce((a,r)=>a+r.high,0)}</td>
            <td class="text-center py-3 text-yellow-600">${rows.reduce((a,r)=>a+r.medium,0)}</td>
            <td class="text-center py-3 text-blue-600">${rows.reduce((a,r)=>a+r.inprog,0)}</td>
            <td class="text-center py-3 text-green-600">${grandDone}</td>
            <td class="py-3 px-4 text-xs text-gray-400">${grandTotal>0?Math.round(grandDone/grandTotal*100):0}% выполнено</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card p-5">
      <h2 class="text-base font-semibold text-gray-800 mb-4">По направлениям</h2>
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
        ${byDir.map(d=>`
        <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
          <div class="font-semibold text-gray-800 mb-3">${d.dir}</div>
          <div class="space-y-1.5 text-sm">
            <div class="flex justify-between"><span class="text-gray-500">Всего задач</span><span class="font-medium">${d.total}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">В работе</span><span class="text-blue-600 font-medium">${d.inprog}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">Готово</span><span class="text-green-600 font-medium">${d.done}</span></div>
            ${d.overdue>0?`<div class="flex justify-between"><span class="text-gray-500">Просрочено</span><span class="text-red-600 font-medium">${d.overdue}</span></div>`:''}
          </div>
          <div class="progress-bar mt-3">
            <div class="progress-fill" style="width:${d.total>0?Math.round(d.done/d.total*100):0}%"></div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderKPI() {
  function pctColor(p) {
    if (p >= 95) return '#16a34a';
    if (p >= 70) return '#f59e0b';
    return '#dc2626';
  }
  function pctBg(p) {
    if (p >= 95) return '#dcfce7';
    if (p >= 70) return '#fef9c3';
    return '#fee2e2';
  }
  function bar(pct, color) {
    const w = Math.min(pct, 100);
    return `<div style="height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:6px">
      <div style="height:100%;width:${w}%;background:${color};border-radius:999px;transition:width .6s"></div>
    </div>`;
  }
  function kpiCard(k) {
    const color = pctColor(k.pct);
    const bg    = pctBg(k.pct);
    return `
    <div class="card p-5">

          <div style="font-size:11px;color:#64748b;margin-top:2px">факт, ${k.unit}</div>
        </div>
        <div style="background:${bg};border-radius:10px;padding:12px">
          <div style="font-size:22px;font-weight:800;color:${color};letter-spacing:-1px">${k.pct}%</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px">выполнение плана</div>
          ${bar(k.pct, color)}
        </div>
        <div style="background:#f8fafc;border-radius:10px;padding:12px">
          <div style="font-size:22px;font-weight:800;color:${k.yoy>=0?'#16a34a':'#dc2626'};letter-spacing:-1px">${k.yoy>0?'+':''}${k.yoy}%</div>

      <!-- KPI и ориентир -->
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <div style="flex:1;background:#eff6ff;border-radius:8px;padding:8px 12px">

          <div style="font-size:14px;font-weight:700;color:#1e40af">${k.kpi2026}</div>
        </div>
        <div style="flex:1;background:#f0fdf4;border-radius:8px;padding:8px 12px">
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#16a34a;margin-bottom:2px">Ориентир 2030</div>

      ${k.quarters ? `

      ${k.containers ? `

      <div style="background:#fef2f2;border-radius:10px;padding:12px;margin-bottom:12px">

        <div style="font-size:20px;font-weight:800;color:#dc2626">${k.approvals.pct}% <span style="font-size:13px;font-weight:500">(${k.approvals.delta} п.п. г/г)</span></div>
        <div style="font-size:11px;color:#64748b;margin-top:2px">доля согласованных заявок — снижение ограничивает грузовую базу</div>
      </div>` : ''}

      <!-- Риски и успехи -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <div style="font-size:11px;font-weight:600;color:#dc2626;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">⚠ Риски</div>
          ${k.risks.map(r=>`<div style="font-size:12px;color:#374151;padding:4px 0;border-bottom:1px solid #f1f5f9;line-height:1.4">${r}</div>`).join('')}
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:#16a34a;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">✓ Достижения</div>
          ${k.wins.map(w=>`<div style="font-size:12px;color:#374151;padding:4px 0;border-bottom:1px solid #f1f5f9;line-height:1.4">${w}</div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  return `
  <div class="p-6 space-y-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">KPI мониторинг</h1>

    <!-- Сводка сверху -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      ${[
        { icon:'✈️', label:'Авиация', pct:92.0, fact:'85,1 тыс. т', yoy:'+7,0%' },

function renderKPIModal() {
  const f = state.kpiForm;
  const DIRS = [
    {v:'avia',label:'✈️ Авиация'},{v:'auto',label:'🚛 Автотранспорт'},{v:'rail',label:'🚂 Железная дорога'},
  ];
  const METRICS = [
    {v:'total',label:'Общий грузооборот'},{v:'transit',label:'Транзит'},
    {v:'export',label:'Экспорт'},{v:'import',label:'Импорт'},{v:'containers',label:'Контейнеры (ДФЭ)'},
  ];
  const UNITS = ['тыс. тонн','млн тонн','тыс. ДФЭ','млн ДФЭ'];
  let periodOptions = '';
  if (f.periodType==='m') {
    ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']
      .forEach((m,i)=>{ periodOptions+=`<option value="${i+1}"${f.period==i+1?' selected':''}>${m}</option>`; });
  } else if (f.periodType==='q') {
    ['Q1 (янв–март)','Q2 (апр–июн)','Q3 (июл–сент)','Q4 (окт–дек)']
      .forEach((q,i)=>{ periodOptions+=`<option value="${i+1}"${f.period==i+1?' selected':''}>${q}</option>`; });
  } else {
    ['I полугодие (янв–июн)','II полугодие (июл–дек)']
      .forEach((h,i)=>{ periodOptions+=`<option value="${i+1}"${f.period==i+1?' selected':''}>${h}</option>`; });
  }
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.showKPIModal=false;render()}">
    <div class="modal" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e5e7eb">
        <h2 style="font-size:16px;font-weight:600">➕ Добавить данные KPI</h2>
        <button onclick="state.showKPIModal=false;render()" style="color:#9ca3af;font-size:22px;background:none;border:none;cursor:pointer">×</button>
      </div>
      <div style="padding:20px 24px">
        <div class="space-y-4">
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px">
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Направление</label>
              <select class="input" onchange="state.kpiForm.direction=this.value;render()">
                ${DIRS.map(d=>`<option value="${d.v}"${f.direction===d.v?' selected':''}>${d.label}</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Показатель</label>
              <select class="input" onchange="state.kpiForm.metric=this.value">
                ${METRICS.map(m=>`<option value="${m.v}"${f.metric===m.v?' selected':''}>${m.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px">
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Год</label>
              <select class="input" onchange="state.kpiForm.year=this.value">
                ${[2025,2026,2027,2028].map(y=>`<option value="${y}"${f.year==y?' selected':''}>${y}</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Тип периода</label>
              <select class="input" onchange="state.kpiForm.periodType=this.value;state.kpiForm.period='1';render()">
                <option value="m"${f.periodType==='m'?' selected':''}>По месяцам</option>
                <option value="q"${f.periodType==='q'?' selected':''}>По кварталам</option>
                <option value="h"${f.periodType==='h'?' selected':''}>По полугодиям</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Период</label>
              <select class="input" onchange="state.kpiForm.period=this.value">${periodOptions}</select>
            </div>
          </div>
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px">
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Значение (факт)</label>
              <input class="input" type="number" step="0.1" placeholder="0.0" value="${f.value}" oninput="state.kpiForm.value=this.value" />
            </div>
            <div>
              <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px">Единица</label>
              <select class="input" onchange="state.kpiForm.unit=this.value">
                ${UNITS.map(u=>`<option value="${u}"${f.unit===u?' selected':''}>${u}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid #e5e7eb">
          <button class="btn btn-secondary" onclick="state.showKPIModal=false;render()">Отмена</button>
          <button class="btn btn-primary" onclick="addKPIEntry()">Добавить</button>
        </div>
      </div>
    </div>
  </div>`;
}

  const el = document.getElementById('transport-news');
  if (!el) return;
  const tagColors = { 'Транзит':'#dbeafe:#1d4ed8', 'Ж/д':'#ede9fe:#6d28d9', 'Авиа':'#fef3c7:#b45309', 'Авто':'#d1fae5:#065f46', 'Общее':'#e0f2fe:#0369a1', 'Беспилотники':'#fce7f3:#9d174d' };
  el.innerHTML = NEWS_ITEMS.map((n,i)=>{
    const [bg,fg] = (tagColors[n.tag]||'#f1f5f9:#475569').split(':');
    return `<div style="padding:14px 0;border-bottom:${i<NEWS_ITEMS.length-1?'1px solid #f1f5f9':'none'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="background:${bg};color:${fg};font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">${n.tag}</span>
        <span style="font-size:11px;color:#94a3b8">${n.date}</span>
      </div>
      <div style="font-size:13px;font-weight:600;color:#0f172a;line-height:1.4;margin-bottom:5px">${n.title}</div>
      <div style="font-size:12px;color:#475569;line-height:1.6;margin-bottom:4px">${n.body}</div>
      <div style="font-size:11px;color:#94a3b8">📎 ${n.source}</div>
    </div>`;
  }).join('');
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = state.user ? renderApp() : renderLogin();
}

function navigate(page) {
  state.page = page;
  render();
  if (page === 'kpi') setTimeout(loadNews, 150);
}

function addKPIEntry() {
  const f = state.kpiForm;
  if (!f.value || isNaN(parseFloat(f.value))) { alert('Введите числовое значение'); return; }
  const PERIOD_LABELS = {
    m: ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
    q: ['Q1','Q2','Q3','Q4'],
    h: ['I п/г','II п/г'],
  };
  state.kpiEntries.push({
    id: Date.now(),
    direction: f.direction,
    metric: f.metric,
    year: Number(f.year),
    periodType: f.periodType,
    period: String(f.period),
    periodLabel: PERIOD_LABELS[f.periodType][Number(f.period)-1],
    value: parseFloat(f.value),
    unit: f.unit,
    addedBy: state.user.name,
    addedAt: new Date().toLocaleDateString('ru-RU'),
  });
  saveToCloud();
  state.showKPIModal = false;
  render();
  setTimeout(loadNews, 150);
}

function deleteKPIEntry(id) {
  if (!confirm('Удалить запись?')) return;
  state.kpiEntries = state.kpiEntries.filter(e=>e.id!==id);
  saveToCloud();
  render();
  setTimeout(loadNews, 150);
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const u = USERS.find(u=>u.email===email);
  if (!u || pass !== u.pass) { state.loginError='Неверный email или пароль'; render(); return; }
  state.user = u;
  state.loginError = '';
  // Reset filters for analyst
  if (u.role === 'analyst') state.filterAssignee = u.id;
  render();
}

function quickLogin(email) {
  document.getElementById('login-email').value = email;
  document.getElementById('login-pass').value = '';
  document.getElementById('login-pass').focus();
}

function doLogout() { state.user=null; state.page='dashboard'; render(); }

function openTask(id) { state.modal={taskId:id}; state.modalTab='details'; render(); }
function closeModal() { state.modal=null; render(); }

function saveTask(id) {
  const t = state.tasks.find(t=>t.id===id);
  const title = document.getElementById('edit-title').value.trim();
  if (!title) { alert('Название обязательно'); return; }
  t.title = title;
  t.assignee = Number(document.getElementById('edit-assignee').value);
  t.dir = document.getElementById('edit-dir').value;
  t.type = document.getElementById('edit-type').value;
  t.priority = Number(document.getElementById('edit-priority').value);
  t.due = document.getElementById('edit-due').value || null;
  saveTasks();
  closeModal();
}

function applyStatus(id) {
  const newStatus = document.getElementById('new-status').value;
  if (!newStatus) { alert('Выберите статус'); return; }
  if (newStatus==='blocked' && !document.getElementById('status-comment').value.trim()) {
    alert('Комментарий обязателен при блокировке'); return;
  }
  state.tasks.find(t=>t.id===id).status = newStatus;
  saveTasks();
  closeModal();
}

function createTask() {
  const title = document.getElementById('create-title').value.trim();
  if (!title) { state.createError='Название обязательно'; render(); return; }
  const newId = Math.max(...state.tasks.map(t=>t.id)) + 1;
  state.tasks.push({
    id: newId,
    title,
    assignee: state.user.role==='head' ? Number(document.getElementById('create-assignee')?.value||state.user.id) : state.user.id,
    dir:      document.getElementById('create-dir').value,
    type:     document.getElementById('create-type').value,
    priority: Number(document.getElementById('create-priority').value),
    status:   'new',
    due:      document.getElementById('create-due').value || null,
    urgent:   false,
  });
  state.showCreateModal=false;
  state.createError='';
  saveTasks();
  render();
}

function kanbanDrop(newStatus) {
  if (!state.kanbanDrag) return;
  const t = state.tasks.find(t=>t.id===state.kanbanDrag);
  if (t) {
    if (newStatus==='done' && state.user.role!=='head') { alert('Только руководитель может закрывать задачи'); return; }
    t.status = newStatus;
    saveTasks();
  }
  state.kanbanDrag = null;
  render();
}

function updateTrack(id, newStatus) {
  const t = state.tracks.find(t=>t.id===id);
  if (t) { t.status = newStatus; saveTracks(); }
}

function deleteTask(id) {
  if (!confirm('Удалить задачу? Это действие нельзя отменить.')) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveTasks();
  state.modal = null;
  render();
}

function exportCSV() {
  const rows = summaryRows();
  const lines = [
    'Сотрудник,Всего,Высокий,Средний,В работе,Готово',
    ...rows.map(r=>`${r.name},${r.total},${r.high},${r.medium},${r.inprog},${r.done}`),
  ];
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`mapap_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
document.getElementById('app').innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#2563eb)">
    <div style="text-align:center;color:#fff">
      <div style="font-size:48px;margin-bottom:16px">🚦</div>
      <div style="font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px">MAPAP</div>
      <div style="font-size:13px;color:#93c5fd">Загрузка данных...</div>
    </div>
  </div>`;

loadFromCloud().then(() => {
  render();
  startPolling();
});
</script>
